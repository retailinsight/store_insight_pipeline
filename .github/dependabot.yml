version: 2
updates:
  # Python deps — requirements-dev.txt and pipeline/deploy/requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/pipeline/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Keep SHA-pinned actions fresh
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

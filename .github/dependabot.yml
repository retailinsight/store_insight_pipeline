version: 2
# Keep this minimal. Dependabot's pip ecosystem at "/" already discovers every
# requirements*.txt in the tree (root, mcp/, pipeline/deploy/), so separate
# per-directory entries DUPLICATE PRs (seen 30 Oct: the same uvicorn bump as
# #17 "in /mcp" and #26 from root). One pip entry + one catch-all group =
# at most one pip PR per week; same for GitHub Actions.
#
# pipeline/deploy/requirements.txt is what the stored procedures run on — any
# bump touching it changes deployed SP behaviour on next deploy. Review the
# weekly PR with that in mind (PR template risk class: "task or schedule
# change" if it touches that file).
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

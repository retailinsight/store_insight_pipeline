[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "api",
    "api2",
    "ui",
    "kpi",
    "pipeline/qc",
    "pipeline/monitoring",
    "**/*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function calls in default args
    "E712",  # `== True` — false-positive on Snowpark `F.col(...) == True` column expressions
]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
# importlib mode avoids pytest inserting the checkout's PARENT dir on sys.path
# (the root __init__.py makes the repo look like a package). Without this a
# sibling checkout named store_insight shadows this repo's code in tests.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv-store-insight",
    "venv_store_insight",
    "pipeline/qc",
    "**/*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function calls in default args
    "E712",  # `== True` — false-positive on Snowpark `F.col(...) == True` column expressions
]

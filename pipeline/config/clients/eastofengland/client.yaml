# East of England Co-op — client overrides
# ==========================================
# Only settings that differ from base/default.yaml need to be listed here.
# Everything else is inherited automatically.

client_name: eastofengland

connection:
  database:  STORE_INSIGHT_DB
  schema:    PUBLIC
  role:      STORE_INSIGHT_ROLE
  warehouse: STORE_INSIGHT_WH

output:
  top_n_per_store: 10
  # Variety cap agreed with Daniel (21 Aug): at most 2 alerts of one signal
  # type per store per day, so MARKDOWN_SKU cannot fill every slot. The cap
  # is broken only when a store has no other signal types to fill top_n
  # (see apply_top_n_filter). Target of 3 alerts/store/day awaits Dave's
  # sign-off; top_n_per_store stays at 10 until then.
  max_per_type_per_store: 2

investigation:
  OSA:
    engine: rule_based
    skill_file: skills/osa_investigation_skill.md
  COMPLIANCE:
    engine: rule_based
    skill_file: skills/compliance_investigation_skill.md
  MARKDOWN_OVERRIDE:
    engine: rule_based
    skill_file: skills/markdown_override_investigation_skill.md
  WASTE:
    engine: rule_based
    skill_file: skills/waste_investigation_skill.md
  MARKDOWN_SELLTHROUGH:
    engine: rule_based
    skill_file: skills/markdown_sellthrough_investigation_skill.md
  MARKDOWN_SKU:
    engine: rule_based
    skill_file: skills/markdown_sku_investigation_skill.md


# Alerts Pipeline — Base Configuration
# ======================================
# Complete set of defaults.  Every setting has a value here so the pipeline
# works out-of-the-box with no client override.
#
# Client-specific overrides live in  config/clients/<name>/client.yaml
# and are deep-merged on top of this file by config/loader.py.

# ── Snowflake connection (non-secret fields) ─────────────────────────────────
# Secrets (account, user, password) stay in the client's .env file.
connection:
  # Role intentionally omitted so SNOWFLAKE_ROLE env var wins for local runs.
  # Client-specific YAMLs can still pin a role if a service account is in use.
  warehouse: STORE_INSIGHT_WH
  database:  STORE_INSIGHT_DB
  schema:    PUBLIC

# ── Source tables ─────────────────────────────────────────────────────────────
# Each entry points at a per-customer adapter view that produces the canonical
# column shape declared in pipeline/contracts/<name>_v1.yaml.  The view DDL
# lives in pipeline/adapters/<client>/<contract>.sql and is deployed by
# pipeline/tools/deploy_views.py.
#
# {database} and {schema} are interpolated from the connection block above,
# so a new client only needs to set their own connection.{database,schema}
# and these table names follow automatically — no per-table overrides
# required unless their source data lives in a different schema.
tables:
  osa:                 "{database}.{schema}.OSA_V1"
  hierarchy:           "{database}.{schema}.HIERARCHY_V1"
  feedback:            "{database}.{schema}.FEEDBACK_V1"
  markdown_log:        "{database}.{schema}.MARKDOWN_LOG_V1"
  markdown_sales:      "{database}.{schema}.MARKDOWN_SALES_V1"
  wastage:             "{database}.{schema}.WASTAGE_V1"
  store_hierarchy:     "{database}.{schema}.STORE_HIERARCHY_V1"
  wmd_hierarchy:       "{database}.{schema}.WMD_HIERARCHY_V1"
  prompted_compliance: "{database}.{schema}.PROMPTED_COMPLIANCE_V1"

# ── Output tables ─────────────────────────────────────────────────────────────
# {database} and {schema} are interpolated from the connection block above.
output:
  alerts:              "{database}.{schema}.ALERTS_PIPELINE"
  top_n_per_store:     10   # 0 = no limit; set to e.g. 10 to cap alerts per store
  # Emit the AFFECTED_PRODUCTS column (VARIANT JSON array of {name, sku,
  # priceHistory}) on each card. OFF by default: the live ALERTS_PIPELINE
  # table does not have this column yet — enabling requires a coordinated
  # ALTER TABLE ... ADD COLUMN AFFECTED_PRODUCTS VARIANT + redeploy release
  # (append fails on column-count mismatch otherwise). priceHistory is null
  # in v1: no unit-price source exists in the current contracts.
  emit_affected_products: false
  signal_type_buckets:
    OSA_STORE_ACTIONABLE: Availability
    OSA_BIG_DROP:         Availability
    OSA_RECURRING_SLOT:   Availability
    COMPLIANCE:           Compliance
    MARKDOWN_COMPLIANCE:    Compliance
    EXPIRY_DATE_COMPLIANCE: Compliance
    PROMPTED_MARKDOWN_COMPLIANCE: Compliance
    MARKDOWN_OVERRIDE:    Markdown
    MARKDOWN_SELLTHROUGH: Markdown
    MARKDOWN_SKU:         Markdown
    WASTE:                Waste
    WASTE_TRIM:           WASTE_TRIM
    STRAIGHT_TO_BIN:      Waste

# ── Detectors ─────────────────────────────────────────────────────────────────
# Module names relative to stages/_1_detect/detectors/.
# Only listed detectors will run.  Order determines merge priority.
detectors:
  enabled:
    - osa_big_drop.big_drop
    - osa_recurring_slot.recurring_slot
    - compliance.tick_and_flick_wow
    - compliance.tick_and_flick_vs_chain
    - markdown_override.vs_chain
    - markdown_override.wow
    - waste.vs_chain
    - waste.wow
    - waste_trim.trim
    - markdown_sellthrough.vs_chain
    - markdown_sellthrough.wow
    - markdown_sku.repeat_request
    - markdown_sku.excessive_override

# ── Detector configuration ─────────────────────────────────────────────────────
# Thresholds and time windows for detectors
detector_config:
  thresholds:
    shared:
      section:              ITEM_HIERARCHY_2
      min_lost_sales_value: 200.0

    OSA_STORE_ACTIONABLE:
      min_actionable_wow_drop:        0.01
      min_actionable_chain_gap:       0.02
      min_actionable_lsv:             200.0
      min_actionable_positive_rows:   10
      max_actionable_unknown_row_pct: 10.0

    OSA_BIG_DROP:
      min_actionable_big_drop:        0.05
      min_osa_big_drop_lsv:           50.0
      min_big_drop_positive_rows:     5
      max_actionable_unknown_row_pct: 10.0

    OSA_RECURRING_SLOT:
      min_item_repeat_weeks: 3        # min distinct weeks per item pattern
      min_item_pattern_lsv:  50.0    # min total £ LSV per item pattern
      min_items:             2        # min qualifying items in the slot to fire

    COMPLIANCE:
      min_compliance_wow_drop:   0.10   # TICK_AND_FLICK — min WoW rise in TF rate
      min_compliance_chain_gap:  0.05   # TICK_AND_FLICK — min gap above chain TF rate
      min_alerts_worked:         5      # TICK_AND_FLICK — min alerts worked

    MARKDOWN_COMPLIANCE:
      min_markdown_compliance_wow_drop:    0.05 # WOW — min WoW drop (ratio)
      min_markdown_compliance_chain_gap:   0.05 # VS_CHAIN — min gap below chain (ratio)
      min_markdown_compliance_volume:        50   # min markdowns due this week

    EXPIRY_DATE_COMPLIANCE:
      min_expiry_compliance_7d_drop:       0.05
      min_expiry_compliance_chain_gap:     0.05
      min_expiry_compliance_volume:          50

    PROMPTED_MARKDOWN_COMPLIANCE:
      min_prompted_markdown_compliance_wow_drop:    0.05 # WOW — min WoW drop (ratio)
      min_prompted_markdown_compliance_chain_gap:   0.05 # VS_CHAIN — min gap below chain (ratio)
      min_prompted_markdown_compliance_volume:        50   # min prompts issued this week

    BIG_DROP_MARKDOWN_COMPLIANCE:
      min_big_drop_markdown_compliance_drop:         0.05
      min_big_drop_markdown_compliance_volume:         10

    BIG_DROP_EXPIRY_DATE_COMPLIANCE:
      min_big_drop_expiry_compliance_drop:           0.05
      min_big_drop_expiry_compliance_volume:           10

    BIG_DROP_PROMPTED_MARKDOWN_COMPLIANCE:
      min_big_drop_prompted_markdown_compliance_drop: 0.05
      min_big_drop_prompted_markdown_compliance_volume: 10

    MARKDOWN_OVERRIDE:
      min_override_chain_gap:    0.05 # pp — min gap vs chain to fire VS_CHAIN
      min_override_wow_increase: 0.05 # pp — min WoW rise to fire WOW
      min_total_markdowns:       10   # min markdown events in window to qualify

    WASTE:
      min_stb_chain_gap:       0.05   # pp — min gap vs chain to fire VS_CHAIN
      min_stb_wow_increase:    0.05   # pp — min WoW rise to fire WOW
      min_waste_qty:           5      # min total waste units to qualify

    WASTE_TRIM:
      min_markdown_sales_ratio: 0.50  # markdown units / total units threshold
      min_markdown_units:       5      # min markdown units sold in the week

    MARKDOWN_SELLTHROUGH:
      min_sellthrough_chain_gap: 0.05 # pp — min gap vs chain to fire VS_CHAIN
      min_sellthrough_wow_drop:  0.05 # pp — min WoW drop to fire WOW
      min_markdown_qty:          10   # min markdown units to qualify

    MARKDOWN_SKU:
      lookback_weeks:          4      # rolling window for SKU-level detectors
      min_markdown_weeks:      3      # REPEAT_REQUEST — min distinct weeks with a request
      min_markdown_requests:   16      # REPEAT_REQUEST — min total requests in window (guards against low-volume, routine markdowns)
      min_sku_override_rate:   0.90   # EXCESSIVE_OVERRIDE — min override rate (0.0–1.0)
      min_sku_requests:        5      # EXCESSIVE_OVERRIDE — min requests in window

    STRAIGHT_TO_BIN:
      min_stb_value_threshold: 100.0  # VALUE_THRESHOLD — £ threshold, fires when strictly exceeded

  lookback_windows:
    wmd: 28   # 4 weeks — required by MARKDOWN_SKU detectors

# ── Gatherers — which fact gatherers run per signal type ─────────────────────
gatherers:
  OSA_STORE_ACTIONABLE:
    - osa_store_actionable_ppg_drilldown
    - osa_store_actionable_item_lsv_changes
    - osa_store_actionable_dow
    - osa_store_actionable_day_periods
    - osa_item_time_patterns
    - osa_store_actionable_chain_drift
    - osa_store_actionable_cost_projection
  OSA_BIG_DROP:
    - osa_big_drop_day_drilldown
  OSA_RECURRING_SLOT:
    - osa_recurring_slot_facts
  COMPLIANCE:
    - tick_and_flick_breakdown
  MARKDOWN_COMPLIANCE:
    - markdown_compliance_facts
  EXPIRY_DATE_COMPLIANCE:
    - expiry_date_compliance_facts
  PROMPTED_MARKDOWN_COMPLIANCE:
    - prompted_markdown_compliance_facts
  MARKDOWN_OVERRIDE:
    - markdown_override_dept_breakdown
  WASTE:
    - waste_dept_breakdown
  WASTE_TRIM:
    - waste_trim_facts
  MARKDOWN_SELLTHROUGH:
    - markdown_sellthrough_dept_breakdown
  MARKDOWN_SKU:
    - markdown_sku_history
  STRAIGHT_TO_BIN:
    - straight_to_bin_facts

# ── Investigation — narrative engine per signal type ─────────────────────────
investigation:
  OSA_STORE_ACTIONABLE:
    engine:     rule_based
    skill_file: ""
  OSA_BIG_DROP:
    engine:     rule_based
    skill_file: ""
  OSA_RECURRING_SLOT:
    engine:     rule_based
    skill_file: skills/osa_recurring_slot_investigation_skill.md
  COMPLIANCE:
    engine:     rule_based
    skill_file: skills/compliance_investigation_skill.md
  MARKDOWN_COMPLIANCE:
    engine:     rule_based
    skill_file: skills/markdown_compliance_investigation_skill.md
  EXPIRY_DATE_COMPLIANCE:
    engine:     rule_based
    skill_file: ""
  PROMPTED_MARKDOWN_COMPLIANCE:
    engine:     rule_based
    skill_file: ""
  MARKDOWN_OVERRIDE:
    engine:     rule_based
    skill_file: skills/markdown_override_investigation_skill.md
  WASTE:
    engine:     rule_based
    skill_file: skills/waste_investigation_skill.md
  WASTE_TRIM:
    engine:     rule_based
    skill_file: skills/waste_trim_investigation_skill.md
  MARKDOWN_SELLTHROUGH:
    engine:     rule_based
    skill_file: skills/markdown_sellthrough_investigation_skill.md
  MARKDOWN_SKU:
    engine:     rule_based
    skill_file: skills/markdown_sku_investigation_skill.md
  STRAIGHT_TO_BIN:
    engine:     rule_based
    skill_file: ""

# ── Schedule & deploy ────────────────────────────────────────────────────────
schedule:
  cron:     "0 6 * * *"
  timezone: Europe/London

# ── Scoring weights ───────────────────────────────────────────────────────────
# Per-signal-type multiplier applied after projected_cost() and before the
# _MULTIPLIERS pipeline in score.py.  Default 1.0 = no scaling.
# Override in config/clients/<name>/client.yaml to tune individual signal types.
# Example: set MARKDOWN_OVERRIDE to 0.05 to treat 5 % of gross markdown value
# as the "at-risk" cost rather than the full value.
scoring:
  score_weights:
    OSA_STORE_ACTIONABLE: 1.0
    OSA_BIG_DROP:         1.0
    OSA_RECURRING_SLOT:   1.0
    COMPLIANCE:           1.0
    MARKDOWN_COMPLIANCE:    1.0
    EXPIRY_DATE_COMPLIANCE: 1.0
    PROMPTED_MARKDOWN_COMPLIANCE: 1.0
    MARKDOWN_OVERRIDE:    0.05
    WASTE:                1.0
    WASTE_TRIM:           1.0
    MARKDOWN_SELLTHROUGH: 1.0
    MARKDOWN_SKU:         1.0
    STRAIGHT_TO_BIN:      1.0

  # Composite score dimension weights (must sum to 1.0).
  # Default: 100% financial severity = score equals projected cost normalised by ceiling.
  # Override to blend in benchmark and WoW dimensions.
  composite_weights:
    financial_severity:       1.0
    vs_control_benchmark:     0.0
    vs_historical_benchmark:  0.0
    thematic:                 0.0
    historical_recency:       0.0
    special_cases:            0.0

  # £ ceiling per signal type for financial_severity normalisation.
  # A signal at or above the ceiling scores 1.0; below it scores proportionally.
  cost_ceilings:
    OSA_STORE_ACTIONABLE: 5000.0
    OSA_BIG_DROP:         5000.0
    OSA_RECURRING_SLOT:   5000.0
    COMPLIANCE:           5000.0
    MARKDOWN_COMPLIANCE:    5000.0
    EXPIRY_DATE_COMPLIANCE: 5000.0
    PROMPTED_MARKDOWN_COMPLIANCE: 5000.0
    MARKDOWN_OVERRIDE:    5000.0
    WASTE:                5000.0
    WASTE_TRIM:           5000.0
    MARKDOWN_SELLTHROUGH: 5000.0
    MARKDOWN_SKU:         5000.0
    STRAIGHT_TO_BIN:      5000.0

  # Percentage-point ceiling for vs_control_benchmark (how far below chain = worst case).
  benchmark_ceilings:
    OSA_STORE_ACTIONABLE: 20.0
    OSA_BIG_DROP:         20.0
    COMPLIANCE:           20.0
    MARKDOWN_COMPLIANCE:    20.0
    EXPIRY_DATE_COMPLIANCE: 20.0
    PROMPTED_MARKDOWN_COMPLIANCE: 20.0
    WASTE:                20.0
    WASTE_TRIM:           20.0
    MARKDOWN_OVERRIDE:    20.0
    MARKDOWN_SELLTHROUGH: 20.0
    STRAIGHT_TO_BIN:      20.0

  # Percentage-point ceiling for vs_historical_benchmark (WoW deterioration = worst case).
  wow_ceilings:
    OSA_STORE_ACTIONABLE: 15.0
    OSA_BIG_DROP:         15.0
    COMPLIANCE:           15.0
    MARKDOWN_COMPLIANCE:    15.0
    EXPIRY_DATE_COMPLIANCE: 15.0
    PROMPTED_MARKDOWN_COMPLIANCE: 15.0
    WASTE:                15.0
    WASTE_TRIM:           15.0
    MARKDOWN_OVERRIDE:    15.0
    MARKDOWN_SELLTHROUGH: 15.0
    STRAIGHT_TO_BIN:      15.0

# ── Data quality / source-data completeness checks ───────────────────────────
# Run before detection.  Warnings are printed by default; strict=true turns
# them into hard errors that stop the pipeline.
# Checks cover: required columns, row counts, date ranges, negative values,
# and expected store coverage (if store_hierarchy is provided).
#
# Stage-0 gate (prd-source-data-quality-gate.md, Dan signed off 27 Aug 2026):
# classifies each daily source vs its trailing 28-day same-weekday median.
# Never blocks the whole run — a FAILED source skips only the detectors that
# consume it (read from each detector's detect() signature); SUSPECT sources
# flag their signals with data_quality_flag = SUSPECT_SOURCE.
data_quality:
  strict: false
  gate_enabled: true
  suspect_fraction: 0.75          # below 75% of baseline → SUSPECT
  failed_fraction: 0.5            # below 50% of baseline → FAILED
  baseline_weeks: 4               # trailing same-weekday baseline
  calendar_exceptions: []         # dates (YYYY-MM-DD) exempt from gating, e.g. bank holidays
  log_table: "{database}.{schema}.DATA_QUALITY_LOG"

# ── Cortex LLM controls ──────────────────────────────────────────────────────
# Budget and quality gates for the Cortex narrative engine.  When the budget is
# exceeded or a response fails quality checks, the pipeline falls back to the
# rule-based engine and records the reason in _fallback_reason.
cortex:
  max_calls_per_run: 100
  max_tokens_per_run: 500000
  max_retries: 2
  quality_max_action_length: 800
  quality_reject_generic: true

# ── Logging / intermediate writes ────────────────────────────────────────────
# Optional debug/replay tables written alongside the main alerts table.
# Table names are derived from output.alerts by appending the suffix below.
# Example: ALERTS_PIPELINE → ALERTS_PIPELINE_SIGNALS_RAW
#   write_signals  : raw detected signals (before enrichment)
#   write_enriched : signals after fact gathering
#   write_run_log  : score audit + investigation/narrative results
logging:
  write_signals:  false
  write_enriched: false
  write_run_log:  false

# ── Alert queue (stage 6) ────────────────────────────────────────────────────
# Suppression, expiry and daily admission caps. Rules agreed with Daniel,
# 9 Sep 2026 (see prds/prd-alert-suppression-and-queue.md).
#
# ALERTS_PIPELINE carries only the live queue, re-written under each day's
# RUN_DATE (the store app reads everything at the latest RUN_DATE per store).
# Suppressed / expired / actioned / not-admitted alerts go to
# <alerts_table>_QUEUE_LOG instead.
#
#   enabled              : master switch — off until the client is ready
#   max_live_per_store   : hard ceiling on live alerts per store
#   max_new_per_day      : newly admitted alerts per store per day (hard cap;
#                          freed slots do not raise it). Cold-start stores
#                          fill straight to max_live_per_store instead
#   expiry_days          : unactioned alerts expire after this many days
#                          (in_progress alerts are exempt)
#   suppression_days     : re-alert window for suppressed families
#   no_suppression_types : signal types that may re-fire immediately
#   action_status_table  : where the store app records completed/in_progress
queue:
  enabled:              false
  max_live_per_store:   8
  max_new_per_day:      3
  expiry_days:          7
  suppression_days:     7
  no_suppression_types: []
  action_status_table:  "{database}.{schema}.ALERT_ACTION_STATUS"

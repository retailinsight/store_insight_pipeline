# Alerts Pipeline — Base Configuration
# ======================================
# Complete set of defaults.  Every setting has a value here so the pipeline
# works out-of-the-box with no client override.
#
# Client-specific overrides live in  config/clients/<name>/client.yaml
# and are deep-merged on top of this file by config/loader.py.

# ── Snowflake connection (non-secret fields) ─────────────────────────────────
# Secrets (account, user, password) stay in the client's .env file.
connection:
  # Role intentionally omitted so SNOWFLAKE_ROLE env var wins for local runs.
  # Client-specific YAMLs can still pin a role if a service account is in use.
  warehouse: STORE_INSIGHT_WH
  database:  STORE_INSIGHT_DB
  schema:    PUBLIC

# ── Source tables ─────────────────────────────────────────────────────────────
# Each entry points at a per-customer adapter view that produces the canonical
# column shape declared in pipeline/contracts/<name>_v1.yaml.  The view DDL
# lives in pipeline/adapters/<client>/<contract>.sql and is deployed by
# pipeline/tools/deploy_views.py.
#
# {database} and {schema} are interpolated from the connection block above,
# so a new client only needs to set their own connection.{database,schema}
# and these table names follow automatically — no per-table overrides
# required unless their source data lives in a different schema.
tables:
  osa:                 "{database}.{schema}.OSA_V1"
  hierarchy:           "{database}.{schema}.HIERARCHY_V1"
  feedback:            "{database}.{schema}.FEEDBACK_V1"
  markdown_log:        "{database}.{schema}.MARKDOWN_LOG_V1"
  markdown_sales:      "{database}.{schema}.MARKDOWN_SALES_V1"
  wastage:             "{database}.{schema}.WASTAGE_V1"
  store_hierarchy:     "{database}.{schema}.STORE_HIERARCHY_V1"
  wmd_hierarchy:       "{database}.{schema}.WMD_HIERARCHY_V1"

# ── Output tables ─────────────────────────────────────────────────────────────
# {database} and {schema} are interpolated from the connection block above.
output:
  alerts:              "{database}.{schema}.ALERTS_PIPELINE"
  top_n_per_store:     10   # 0 = no limit; set to e.g. 10 to cap alerts per store
  signal_type_buckets:
    OSA:                  Availability
    COMPLIANCE:           Compliance
    MARKDOWN_OVERRIDE:    Markdown
    MARKDOWN_SELLTHROUGH: Markdown
    MARKDOWN_SKU:         Markdown
    WASTE:                Waste

# ── Detectors ─────────────────────────────────────────────────────────────────
# Module names relative to stages/_1_detect/detectors/.
# Only listed detectors will run.  Order determines merge priority.
detectors:
  enabled:
    - osa.wow
    - osa.vs_chain
    - osa.repeat
    - compliance.tick_and_flick
    - markdown_override.vs_chain
    - markdown_override.wow
    - waste.vs_chain
    - waste.wow
    - markdown_sellthrough.vs_chain
    - markdown_sellthrough.wow
    - markdown_sku.repeat_request
    - markdown_sku.excessive_override

# ── Detector configuration ─────────────────────────────────────────────────────
# Thresholds and time windows for detectors
detector_config:
  thresholds:
    shared:
      section:              ITEM_HIERARCHY_2
      min_lost_sales_value: 200.0

    OSA:
      min_wow_drop:         0.01      # WOW — min WoW drop to fire
      min_chain_gap:        0.03      # VS_CHAIN — min gap vs chain to fire
      min_alert_weeks:      4         # REPEAT — min weeks with alerts
      min_osa_drop:         0.05      # REPEAT — min OSA drop
      min_weekly_lsv:       50.0      # REPEAT — min weekly lost-sales value

    COMPLIANCE:
      min_wow_increase:        0.10   # TICK_AND_FLICK — min WoW rise
      min_chain_outperform:    0.05   # TICK_AND_FLICK — min gap above chain
      min_alerts_worked:       5      # TICK_AND_FLICK — min alerts worked

    MARKDOWN_OVERRIDE:
      min_override_chain_gap:    0.05 # pp — min gap vs chain to fire VS_CHAIN
      min_override_wow_increase: 0.05 # pp — min WoW rise to fire WOW
      min_total_markdowns:       10   # min markdown events in window to qualify

    WASTE:
      min_stb_chain_gap:       0.05   # pp — min gap vs chain to fire VS_CHAIN
      min_stb_wow_increase:    0.05   # pp — min WoW rise to fire WOW
      min_waste_qty:           5      # min total waste units to qualify

    MARKDOWN_SELLTHROUGH:
      min_sellthrough_chain_gap: 0.05 # pp — min gap vs chain to fire VS_CHAIN
      min_sellthrough_wow_drop:  0.05 # pp — min WoW drop to fire WOW
      min_markdown_qty:          10   # min markdown units to qualify

    MARKDOWN_SKU:
      lookback_weeks:          4      # rolling window for SKU-level detectors
      min_markdown_weeks:      3      # REPEAT_REQUEST — min distinct weeks with a request
      min_markdown_requests:   8      # REPEAT_REQUEST — min total requests in window (guards against low-volume, routine markdowns)
      min_sku_override_rate:   0.90   # EXCESSIVE_OVERRIDE — min override rate (0.0–1.0)
      min_sku_requests:        5      # EXCESSIVE_OVERRIDE — min requests in window

  lookback_windows:
    osa: 69   # ~10 weeks — required by the OSA REPEAT detector
    wmd: 28   # 4 weeks — required by MARKDOWN_SKU detectors

# ── Gatherers — which fact gatherers run per signal type ─────────────────────
gatherers:
  OSA:
    - osa_ppg_drilldown
    - osa_dow
    - osa_chain_drift
    - osa_repeat_history
    - osa_cost_projection
  COMPLIANCE:
    - tick_and_flick_breakdown
  MARKDOWN_OVERRIDE:
    - markdown_override_dept_breakdown
  WASTE:
    - waste_dept_breakdown
  MARKDOWN_SELLTHROUGH:
    - markdown_sellthrough_dept_breakdown
  MARKDOWN_SKU:
    - markdown_sku_history

# ── Investigation — narrative engine per signal type ─────────────────────────
investigation:
  OSA:
    engine:     rule_based
    skill_file: skills/osa_investigation_skill.md
  COMPLIANCE:
    engine:     rule_based
    skill_file: skills/compliance_investigation_skill.md
  MARKDOWN_OVERRIDE:
    engine:     rule_based
    skill_file: skills/markdown_override_investigation_skill.md
  WASTE:
    engine:     rule_based
    skill_file: skills/waste_investigation_skill.md
  MARKDOWN_SELLTHROUGH:
    engine:     rule_based
    skill_file: skills/markdown_sellthrough_investigation_skill.md
  MARKDOWN_SKU:
    engine:     rule_based
    skill_file: skills/markdown_sku_investigation_skill.md

# ── Schedule & deploy ────────────────────────────────────────────────────────
schedule:
  cron:     "0 6 * * *"
  timezone: Europe/London

# ── Scoring weights ───────────────────────────────────────────────────────────
# Per-signal-type multiplier applied after projected_cost() and before the
# _MULTIPLIERS pipeline in score.py.  Default 1.0 = no scaling.
# Override in config/clients/<name>/client.yaml to tune individual signal types.
# Example: set MARKDOWN_OVERRIDE to 0.05 to treat 5 % of gross markdown value
# as the "at-risk" cost rather than the full value.
scoring:
  score_weights:
    OSA:                  1.0
    COMPLIANCE:           1.0
    MARKDOWN_OVERRIDE:    0.05
    WASTE:                1.0
    MARKDOWN_SELLTHROUGH: 1.0
    MARKDOWN_SKU:         1.0

  # Composite score dimension weights (must sum to 1.0).
  # Default: 100% financial severity = score equals projected cost normalised by ceiling.
  # Override to blend in benchmark and WoW dimensions.
  composite_weights:
    financial_severity:       1.0
    vs_control_benchmark:     0.0
    vs_historical_benchmark:  0.0
    thematic:                 0.0
    historical_recency:       0.0
    special_cases:            0.0

  # £ ceiling per signal type for financial_severity normalisation.
  # A signal at or above the ceiling scores 1.0; below it scores proportionally.
  cost_ceilings:
    OSA:                  5000.0
    COMPLIANCE:           5000.0
    MARKDOWN_OVERRIDE:    5000.0
    WASTE:                5000.0
    MARKDOWN_SELLTHROUGH: 5000.0
    MARKDOWN_SKU:         5000.0

  # Percentage-point ceiling for vs_control_benchmark (how far below chain = worst case).
  benchmark_ceilings:
    OSA:                  20.0
    COMPLIANCE:           20.0
    WASTE:                20.0
    MARKDOWN_OVERRIDE:    20.0
    MARKDOWN_SELLTHROUGH: 20.0

  # Percentage-point ceiling for vs_historical_benchmark (WoW deterioration = worst case).
  wow_ceilings:
    OSA:                  15.0
    COMPLIANCE:           15.0
    WASTE:                15.0
    MARKDOWN_OVERRIDE:    15.0
    MARKDOWN_SELLTHROUGH: 15.0

# ── Data quality / source-data completeness checks ───────────────────────────
# Run before detection.  Warnings are printed by default; strict=true turns
# them into hard errors that stop the pipeline.
# Checks cover: required columns, row counts, date ranges, negative values,
# and expected store coverage (if store_hierarchy is provided).
data_quality:
  strict: false

# ── Cortex LLM controls ──────────────────────────────────────────────────────
# Budget and quality gates for the Cortex narrative engine.  When the budget is
# exceeded or a response fails quality checks, the pipeline falls back to the
# rule-based engine and records the reason in _fallback_reason.
cortex:
  max_calls_per_run: 100
  max_tokens_per_run: 500000
  max_retries: 2
  quality_max_action_length: 800
  quality_reject_generic: true

# ── Logging / intermediate writes ────────────────────────────────────────────
# Optional debug/replay tables written alongside the main alerts table.
# Table names are derived from output.alerts by appending the suffix below.
# Example: ALERTS_PIPELINE → ALERTS_PIPELINE_SIGNALS_RAW
#   write_signals  : raw detected signals (before enrichment)
#   write_enriched : signals after fact gathering
#   write_run_log  : score audit + investigation/narrative results
logging:
  write_signals:  false
  write_enriched: false
  write_run_log:  false

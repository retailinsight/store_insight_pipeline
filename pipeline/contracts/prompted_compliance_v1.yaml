# Contract: prompted_compliance (v1)
# ====================================
# Prompted compliance data at store, product, and alert-date grain.
#
# Per-customer adapter views must produce a relation with exactly the columns
# below and the declared grain. Adapters live in
# pipeline/adapters/<client>/prompted_compliance.sql.

name: prompted_compliance
version: v1

description: |
  Prompted compliance data at store, product, and alert-date grain.

grain:
  - STORE_ID
  - UPC
  - ALERT_DATE

columns:
  STORE_ID:
    type: NUMBER
    description: Store identifier.

  UPC:
    type: VARCHAR
    description: Product identifier.

  ALERT_DATE:
    type: DATE
    description: Date of the prompted compliance alert.

  COMPLIANT:
    type: BOOLEAN
    description: Whether the prompted compliance alert was compliant.

  TOTAL_UNITS:
    type: NUMBER
    description: Total units associated with the alert.

  ITEM_HIERARCHY_1:
    type: VARCHAR
    description: Top-level item hierarchy.

  ITEM_HIERARCHY_2:
    type: VARCHAR
    description: Second-level item hierarchy.

  ITEM_HIERARCHY_3:
    type: VARCHAR
    description: Third-level item hierarchy.

  ITEM_DESCRIPTION:
    type: VARCHAR
    description: Human-readable item description.

# Contract: store_hierarchy (v1)
# ===================================
# Store master for the WMD pipelines.  Joined into markdown_log,
# markdown_sales, and wastage to resolve store names for narrative output.
#
# Today's reference: ANALYSIS.FINAL.WMD_SITE_HIERARCHY (East of England),
# loaded with SITE_ID → STORE_ID and SITE_NAME → STORE_NAME aliases in
# pipeline/pipeline/run_batch.py load_wmd().

name: store_hierarchy
version: v1

description: |
  Store master for WMD-side alerts.  One row per store.  Provides
  human-readable store names for narrative output.

grain:
  - STORE_ID

columns:
  STORE_ID:
    type: NUMBER
    required: true
    description: |
      Numeric store identifier — joins to STORE_ID on all WMD
      transactional contracts.

  STORE_NAME:
    type: VARCHAR
    required: true
    description: |
      Human-readable store name (e.g. 'West Mersea Supermarket').
      Selected with .alias('SITE_NAME') by some gatherers; both names
      are used interchangeably in the codebase.

  REGION:
    type: VARCHAR
    required: false
    description: |
      Optional region code or name.  Not currently aggregated by any
      detector but supports future regional breakdowns.

  AREA_NUMBER:
    type: VARCHAR
    required: false
    description: |
      Optional area code (e.g. '5 S', '6 E').  Same status as REGION.

data_quality_findings:
  - column: STORE_NAME
    severity: medium
    concern: |
      Must not be NULL — narratives will render literal "None" if the
      store name is missing.  Adapter views should COALESCE to a
      sensible fallback (e.g. 'Store ' || STORE_ID::VARCHAR).

notes: |
  - This contract intentionally keeps the column set narrow — fields like
    SQUARE_FOOTAGE, NUMBER_OF_BASKETS, POSTCODE etc. exist in the EoE
    source but are not consumed by any detector or gatherer today.
    Adapters may include them for ad-hoc queries; they are simply ignored
    by the pipeline.

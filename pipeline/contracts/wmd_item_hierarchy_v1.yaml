# Contract: wmd_item_hierarchy (v1)
# ==================================
# WMD-side item master.  Joined into markdown_log, markdown_sales, and
# wastage to resolve item names and department groupings.
#
# Today's reference: ANALYSIS.FINAL.WMD_ITEM_HIERARCHY (East of England),
# deduplicated to latest snapshot per VME_CODE in pipeline/pipeline/run_batch.py
# load_wmd().

name: wmd_item_hierarchy
version: v1

description: |
  Item master for the WMD pipelines (markdown / waste alerts).  One row
  per ITEM_ID after deduplication.  Distinct from the OSA-side `hierarchy`
  contract because the WMD source has a different shape and historically
  used a different join key (VME_CODE).

grain:
  - ITEM_ID

columns:
  ITEM_ID:
    type: NUMBER
    required: true
    description: |
      Numeric item identifier — the join key for all WMD transactional
      tables (markdown_log, markdown_sales, wastage).  Sourced from
      VME_CODE in EoE; cast to NUMBER by the adapter view.

  ITEM_DESCRIPTION:
    type: VARCHAR
    required: true
    description: |
      Human-readable item name.  Used in narrative output for
      MARKDOWN_SKU and MARKDOWN_OVERRIDE alerts.

  DEPARTMENT:
    type: NUMBER
    required: true
    description: |
      Top-level grouping dimension for waste / markdown alerts.  Today's
      EoE adapter sources this from HIERARCHY_LEVEL_1_ID (a numeric code,
      not a name).  Detectors and gatherers treat it as an opaque grouping
      key — they group by it and emit it on output but never display it.
      Functional equivalent of DEPARTMENT_NAME on the OSA-side `hierarchy`
      contract, but the WMD source uses a numeric code.

  SECTION:
    type: VARCHAR
    required: false
    description: Mid-level grouping; used by some breakdown gatherers.

  SUB_SECTION:
    type: VARCHAR
    required: false
    description: Sub-departmental grouping; used in narrative breakdowns.

data_quality_findings:
  - column: ITEM_ID
    severity: high
    concern: |
      The EoE source stores this as VME_CODE (LONG); some other customers
      may have item IDs as VARCHAR.  Adapter views must CAST to NUMBER
      consistent with the markdown_log.ITEM_ID type or joins will silently
      produce no rows.
  - column: DEPARTMENT
    severity: medium
    concern: |
      Free-text field; adapter views should NOT translate values into
      English even for non-English customers — the rest of the pipeline
      treats this as an opaque grouping key, not display text.

notes: |
  - The EoE source is snapshot-based (multiple rows per VME_CODE differing
    only by FILE_TIMESTAMP).  The adapter view must deduplicate to the
    latest snapshot per ITEM_ID.  See pipeline/adapters/eastofengland/
    wmd_item_hierarchy.sql for the reference pattern.

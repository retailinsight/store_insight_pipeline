# Contract: hierarchy (v1)
# =========================
# Item master / hierarchy dimension joined into the OSA fact at load time.
#
# Today's reference implementation: ANALYSIS.FINAL.LSM_ITEM_HIERARCHY
# (East of England), selected with .distinct() in pipeline/pipeline/run_batch.py
# load_osa().

name: hierarchy
version: v1

description: |
  Item master with 4-level hierarchy (division, department, subclass, PPG).
  Provides ITEM_HIERARCHY_1-4 (names) and ITEM_HIERARCHY_ID_1-4 (numeric IDs)
  plus ITEM_DESCRIPTION for unified OSA and WMD pipeline usage.
  One row per ITEM_CODE.

grain:
  - ITEM_CODE

columns:
  ITEM_CODE:
    type: VARCHAR
    required: true
    description: |
      Join key to the OSA fact.  Sourced from MASTER_ITEM_ID on EoE; other
      customers' adapters will alias whatever their join key is.

  ITEM_ID:
    type: NUMBER
    required: false
    description: |
      Optional second item identifier.  Today's EoE adapter selects it but
      no downstream detector reads it directly (item resolution goes via
      ITEM_CODE).  Kept optional for forward compatibility.

  ITEM_HIERARCHY_1:
    type: VARCHAR
    required: true
    description: Division level name (top of hierarchy).

  ITEM_HIERARCHY_2:
    type: VARCHAR
    required: true
    description: Department level name. Rows with NULL are filtered post-join.

  ITEM_HIERARCHY_3:
    type: VARCHAR
    required: false
    description: PPG level name.

  ITEM_HIERARCHY_ID_1:
    type: NUMBER
    required: false
    description: Division level numeric ID.

  ITEM_HIERARCHY_ID_2:
    type: NUMBER
    required: false
    description: Department level numeric ID (used for WMD grouping).

  ITEM_HIERARCHY_ID_3:
    type: NUMBER
    required: false
    description: PPG level numeric ID.

  ITEM_DESCRIPTION:
    type: VARCHAR
    required: false
    description: Human-readable item name for markdown/waste narratives.

data_quality_findings:
  - column: ITEM_HIERARCHY_2
    severity: high
    concern: |
      Rows with NULL ITEM_HIERARCHY_2 (department) are silently dropped
      from all OSA output by the loader's post-join filter. Adapter authors
      should ensure non-saleable / archived items are the only ones with
      NULL here, otherwise live items will be invisible to alerts.

checks:
  - column: ITEM_HIERARCHY_2
    rule: no_nulls
    severity: high

notes: |
  - Pipeline applies .distinct() at load time, so duplicate ITEM_CODE rows
    in the source view are tolerated but wasteful — adapters should
    deduplicate at source where possible.
  - This contract is "wide and shallow": one row per item, joined many-to-one
    against OSA.

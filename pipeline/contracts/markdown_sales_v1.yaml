# Contract: markdown_sales (v1)
# ==============================
# Markdown sell-through — one row per sale of a marked-down item.
# Used by the MARKDOWN_SELLTHROUGH detector.
#
# Today's reference: ANALYSIS.FINAL.WMD_SALES (East of England),
# loaded with column aliases in pipeline/pipeline/run_batch.py load_wmd().

name: markdown_sales
version: v1

description: |
  Sales of items at markdown price.  Numerator for the sell-through rate
  (units sold at markdown / units put through markdown).  Lower-than-chain
  sell-through indicates the store's markdowns are not landing.

grain:
  - STORE_ID
  - UPC
  - DATE

columns:
  STORE_ID:
    type: NUMBER
    required: true
    description: Store of sale.

  UPC:
    type: NUMBER
    required: true
    description: Item sold (UPC); joins to wmd_item_hierarchy.

  DATE:
    type: DATE
    required: true
    description: |
      Sale date (calendar day).  Pipeline filters by this column.  Note the
      bare name "DATE" follows existing pipeline convention; adapter views
      may need to alias from a more descriptive source name.

  TIME:
    type: VARCHAR
    required: false
    description: |
      Sale time (HH:MM:SS).  Optional; not currently filtered on or used
      to disambiguate rows.  Multiple sale rows for the same
      store/item/day are aggregated together by all detectors, so TIME is
      retained for ad-hoc queries only.

  MARKDOWN_QUANTITY:
    type: NUMBER
    required: true
    description: |
      Units sold at markdown price.  Aggregated to compute SELLTHROUGH_RATE.

  MARKDOWN_VALUE:
    type: NUMBER
    required: true
    description: |
      £ value of the markdown sale.  Used by scoring and cost-projection
      narratives.  EoE adapter sources this from SALE_VALUE, mirroring
      today's load_wmd() — see the SQL view for the alias.

joins:
  - contract: wmd_item_hierarchy
    cardinality: many_to_one
    match:
      UPC: UPC
    purpose: Resolve item name and department for narrative output.
  - contract: wmd_store_hierarchy
    cardinality: many_to_one
    match:
      STORE_ID: STORE_ID
    purpose: Resolve store name for narrative output.

data_quality_findings:
  - column: MARKDOWN_QUANTITY
    severity: medium
    concern: |
      Must be a positive number — refunds / reversals as negative units
      will silently reduce SELLTHROUGH_RATE.  Adapter views should filter
      negatives or model them via a separate refunds contract in future.
  - column: DATE
    severity: low
    concern: |
      "DATE" is a Snowflake reserved word in some contexts.  Adapter
      authors should always quote it ("DATE") in their view DDL to avoid
      ambiguity.

freshness_max_age_days: 1

checks:
  - column: MARKDOWN_QUANTITY
    rule: positive
    severity: medium

notes: |
  - Pipeline applies the same 4-week lookback as markdown_log.
  - To combine markdown sales with OSA actual sales, join through the WMD
    hierarchy crosswalk: markdown_sales.UPC -> wmd_item_hierarchy.UPC ->
    wmd_item_hierarchy.OSA_ITEM_CODE -> osa.ITEM_CODE.  Do not join UPC
    directly to osa.ITEM_CODE.
  - The crosswalk is many-to-one: each WMD UPC has one OSA item code, but an
    OSA item code can represent multiple WMD UPCs.  Aggregate markdown
    quantities and values to STORE_ID, DATE, OSA_ITEM_CODE before joining OSA
    facts; joining OSA facts back to individual UPCs duplicates OSA measures.
  - SELLTHROUGH = SUM(MARKDOWN_QUANTITY) / SUM(QTY_MARKDOWN)  — the
    denominator comes from the markdown_log contract, NOT from this one.
  - There is intentionally no ORIGINAL_RETAIL_PRICE column on this
    contract.  EoE's WMD_SALES exposes SALE_VALUE, ACTUAL_SALE_VALUE,
    REDUCTION_VALUE, PROMO_DISCOUNT and GLOBAL_DISCOUNT but no native
    pre-markdown unit price.  An earlier draft of this contract (and the
    semantic-model doc) listed ORIGINAL_RETAIL_PRICE as available — that
    was a documentation error; the column is not surfaced by EoE's source.
    If a future customer's source has a true pre-markdown unit price it
    can be added back as an optional column at that time, but speculating
    now would only invite confusion.

# Signal Type → Narrative Engine Mapping
# ========================================
# Defines which narrative engine and investigation skill runs for each alert
# signal type.  This is the single source of truth for the Stage 3 dispatch.
#
# Engines
# -------
# rule_based : Deterministic string templates. No external dependencies.
#              Always produces output, never fails. Default.
# cortex     : Snowflake Cortex LLM (mistral-large2). Requires a Snowpark
#              session. Falls back to rule_based on any failure.
#
# skill_file : Path (relative to this file's directory) to the investigation
#              skill markdown for this alert type.  Loaded by cortex.py as
#              part of the LLM prompt.  Also used for documentation display.
#
# To switch an alert type to Cortex, change its engine value.
# To add a new signal type, add a block here and ensure both engine modules
# handle it internally.

OSA_STORE_ACTIONABLE:
  engine: rule_based
  skill_file: ""
  description: Store-actionable OSA alerts — WOW and VS_CHAIN triggers

OSA_BIG_DROP:
  engine: rule_based
  skill_file: ""
  description: Day-on-day store-controlled OSA drop alerts — BIG_DROP trigger

OSA_RECURRING_SLOT:

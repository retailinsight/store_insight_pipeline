# Signal Type → Scorer Mapping
# ==============================
# Defines which scorer module runs for each alert signal type.
# This is the single source of truth for the Stage 4 dispatch.
#
# Rules
# -----
# - Exactly one scorer per signal type.
# - Each name must match a module in the scorers/ sub-package.
# - Add a new entry here when a new signal type is introduced.
#
# Displayed in the pipeline docs and QC notebooks.

OSA_STORE_ACTIONABLE:
  name: osa_store_actionable
  description: projected_cost = this_week_lsv.store_controlled

OSA_BIG_DROP:
  name: osa_big_drop
  description: projected_cost = this_week_lsv.store_controlled

OSA_RECURRING_SLOT:
  name: osa_recurring_slot
  description: projected_cost = avg_weekly_lsv × projection_weeks

WASTE:
  name: waste
  description: projected_cost = this_week_waste_value (direct £ — no DB query)

WASTE_TRIM:
  name: waste_trim
  description: projected_cost = markdown_value (total £ markdown sales for the flagged store-item this week)

MARKDOWN_SELLTHROUGH:
  name: markdown_sellthrough
  description: projected_cost = this_week_markdown_value × (1 − sellthrough_rate / 100)

MARKDOWN_COMPLIANCE:
  name: markdown_compliance
  description: projected_cost = this_week_at_risk_value (pre-computed from the canonical synthetic DataFrame)

EXPIRY_DATE_COMPLIANCE:
  name: expiry_date_compliance
  description: projected_cost = trailing_7d_at_risk_value (pre-computed from the canonical synthetic DataFrame)

PROMPTED_MARKDOWN_COMPLIANCE:
  name: prompted_markdown_compliance
  description: projected_cost = this_week_at_risk_value (pre-computed from the canonical synthetic DataFrame)

BIG_DROP_MARKDOWN_COMPLIANCE:
  name: big_drop_markdown_compliance
  description: projected_cost = this_day_at_risk_value

BIG_DROP_EXPIRY_DATE_COMPLIANCE:
  name: big_drop_expiry_date_compliance
  description: projected_cost = this_day_at_risk_value

BIG_DROP_PROMPTED_MARKDOWN_COMPLIANCE:
  name: big_drop_prompted_markdown_compliance
  description: projected_cost = this_day_at_risk_value

MARKDOWN_OVERRIDE:
  name: markdown_override
  description: projected_cost = this_week_overrides × avg_£_per_markdown_event (queried from markdown_log + markdown_sales)

MARKDOWN_SKU:
  name: markdown_sku
  description: projected_cost = (override_count / lookback_weeks) × avg_unit_markdown_value (queried from markdown_sales)

STRAIGHT_TO_BIN:
  name: straight_to_bin
  description: projected_cost = last_week_stb_value (total £ straight-to-bin value last week — no DB query)

COMPLIANCE:
  name: compliance
  description: projected_cost = SUM(osa.LOST_SALES_VALUE of items behind tick-and-flicked alerts) (feedback joined to osa on store + item + date)

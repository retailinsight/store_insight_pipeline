# Signal Type → Fact Gatherer Mapping
# =====================================
# Defines which fact gatherers run for each alert signal type.
# This is the single source of truth for the Stage 2 dispatch.
#
# Rules
# -----
# - Gatherers run in the order listed.
# - Each name must match a module in the gatherers/ sub-package.
# - A gatherer can appear under multiple signal types.
# - Add a new signal type block here when a new detector is introduced.
#
# Displayed in the pipeline docs and QC notebooks to show what evidence
# is collected per alert type.

OSA_STORE_ACTIONABLE:
  - name: osa_store_actionable_ppg_drilldown
    description: Top latest-week PPGs with prior-week attributed LSV changes
  - name: osa_store_actionable_item_lsv_changes
    description: Top item offenders with prior-week changes and UPC/EAN arrays
  - name: osa_store_actionable_dow
    description: Seven chronological day rows with attributed LSV and source status
  - name: osa_store_actionable_day_periods
    description: Top day-period rows by store-controlled LSV
  - name: osa_item_time_patterns
    description: Complete 7x3 day-period grid, latest-week top items, and repeat timing patterns
  - name: osa_store_actionable_chain_drift
    description: Store-controlled chain OSA drift context
  - name: osa_store_actionable_cost_projection
    description: Attributed four-week cost-of-inaction projection

OSA_BIG_DROP:
  - name: osa_big_drop_day_drilldown
    description: Compact time-of-day grid, PPG, and item store-controlled LSV facts

OSA_RECURRING_SLOT:
  - name: osa_recurring_slot_facts
    description: Week-by-week slot history, share of department LSV, and LSV trend for the flagged day-of-week + reporting-period slot

COMPLIANCE:
  - name: tick_and_flick_breakdown
    description: Tick-and-flick alert-type breakdown, seven-day trailing tick-and-flick count series, and driver assessment for each flagged store (requires feedback DataFrame)

MARKDOWN_COMPLIANCE:
  - name: markdown_compliance_facts
    description: Daily on-time completion breakdown, worst departments, and workload/coaching driver assessment (requires canonical synthetic DataFrame)

BIG_DROP_MARKDOWN_COMPLIANCE:
  - name: markdown_compliance_facts
    description: Daily on-time completion breakdown, worst departments, and workload/coaching driver assessment (requires canonical synthetic DataFrame)

EXPIRY_DATE_COMPLIANCE:
  - name: expiry_date_compliance_facts
    description: Chain movement, complete daily performance, worst departments, expiry markdown movement, and driver assessment from synthetic rows

BIG_DROP_EXPIRY_DATE_COMPLIANCE:
  - name: expiry_date_compliance_facts
    description: Chain movement, complete daily performance, worst departments, expiry markdown movement, and driver assessment from synthetic rows

PROMPTED_MARKDOWN_COMPLIANCE:
  - name: prompted_markdown_compliance_facts
    description: Daily on-time actioned breakdown, worst departments, and workload/coaching driver assessment from synthetic rows

BIG_DROP_PROMPTED_MARKDOWN_COMPLIANCE:
  - name: prompted_markdown_compliance_facts
    description: Daily on-time actioned breakdown, worst departments, and workload/coaching driver assessment from synthetic rows

MARKDOWN_OVERRIDE:
  - name: markdown_override_dept_breakdown
    description: Top-N departments by override count and override rate this week (requires item_hierarchy DataFrame)

WASTE:
  - name: waste_dept_breakdown
    description: Top-N departments by straight-to-bin quantity and waste value this week (requires item_hierarchy DataFrame)

WASTE_TRIM:
  - name: waste_trim_facts
    description: Chain/dept markdown-sales ratio benchmarks and weekly trend for the flagged store-item (requires markdown_sales and osa DataFrames)

MARKDOWN_SELLTHROUGH:
  - name: markdown_sellthrough_dept_breakdown
    description: Top-N departments by lowest sell-through rate this week (requires markdown_sales, markdown_log, item_hierarchy DataFrames)

STRAIGHT_TO_BIN:
  - name: straight_to_bin_facts
    description: Daily STB breakdown, worst departments, top items, chain average, markdown compliance by day, and items with no expiry date

BINNED_WASTE:
  - name: binned_waste_trend_facts
    description: Seven-day waste-value series, prompted-markdown checks due vs actioned, and department/item breakdowns for the current 7-day window (TREND trigger)
  - name: binned_waste_spike_facts
    description: Seven-day waste-value series ending today (today highlighted), prompted-markdown checks due vs actioned, and department/item breakdowns for ANALYSIS_DATE only (SPIKE trigger)

MARKDOWN_SKU:
  - name: markdown_sku_history
    description: Week-by-week markdown request and override history for each flagged store-SKU combination
